<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Git 学习演示</h1>
            <p>学习 Git 的基本操作</p>
        </header>
        
        <main>
            <section>
                <h2>常用 Git 命令</h2>
                <ul>
                    <li><code>git init</code> - 初始化仓库</li>
                    <li><code>git add</code> - 添加文件到暂存区</li>
                    <li><code>git commit</code> - 提交更改</li>
                    <li><code>git push</code> - 推送到远程仓库</li>
                    <li><code>git pull</code> - 拉取远程更新</li>
                    <li><code>git branch</code> - 管理分支</li>
                    <li><code>git checkout</code> - 切换分支</li>
                </ul>
            </section>

            <section>
                <h2>分支操作演示</h2>
                <div class="branch-demo">
                    <div class="branch main">main</div>
                    <div class="branch feature">feature</div>
                    <div class="branch dev">dev</div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2024 Git 学习 Demo</p>
        </footer>
    </div>
</body>
</html>
